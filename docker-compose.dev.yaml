name: fastapi-cadastre
services:
  
  db:
    image: postgres:16-alpine
    container_name: cadastre_db_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadastre_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cadastre_redis_dev
    restart: always
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app_dev
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=cadastre_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EXTERNAL_SERVER_URL=http://external_web:8001/result
    command: ["fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - db
      - redis

  external_web:
    build:
      context: .
      dockerfile: Dockerfile.external
    container_name: external_server_dev
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./external_server:/app/external_server
    command: ["fastapi", "dev", "external_server/main.py", "--host", "0.0.0.0", "--port", "8001"]

volumes:
  postgres_data_dev: