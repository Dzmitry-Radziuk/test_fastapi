name: fastapi-cadastre

services:
  db:
    image: postgres:16-alpine
    container_name: cadastre_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cadastre_redis_prod
    restart: always
    expose:
      - "6379"

  web:
    image: radziukdzmitry/fastapi-app:latest
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EXTERNAL_SERVER_URL=http://external_web:8001/result
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
    command: ["fastapi", "run", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - db
      - redis

  external_web:
    image: radziukdzmitry/fastapi-external-app:latest
    container_name: external_server_prod
    restart: always
    expose:
      - "8001:8001"
    command: ["fastapi", "run", "external_server/main.py", "--host", "0.0.0.0", "--port", "8001"]

volumes:
  postgres_data_prod: